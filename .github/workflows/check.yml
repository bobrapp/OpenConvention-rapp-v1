name: Offline regression checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.17.0'
      - run: npm ci --prefix tests && npm ci --prefix claude-v1/tests
      - run: cd tests && npx playwright install --with-deps chromium
      - run: node --check app.js && node --check i18n.js && node --check backup.js && node --check calendar.js
      - run: python3 build_muse.py && python3 claude-v1/build.py
      - run: git diff --exit-code -- 'R4 Muse V1' claude-v1/index.html
      - run: npm test --prefix tests
      - run: npm test --prefix claude-v1/tests
      - run: node tests/workflow-check.mjs && git diff --check
