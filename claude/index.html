<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>r4 Networking Companion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600&display=swap">
<style>
/* layout: one phone-width column, sticky day header, fixed six-tab bar; filled blue only for the one thing to do next */
:root{
  --bg:#f3f6fd; --surface:#ffffff; --sunk:#e8eefb; --ink:#07173d; --muted:#55628c; --line:#d5def3;
  --blue:#0c62fb; --on-blue:#ffffff; --blue-soft:#e1ebff; --blue-ink:#0a4fd0; --hero:#0c62fb; --hero-2:#0848c4;
  --warn:#b3261e; --warn-soft:#fde8e6; --ok:#0f7a55; --ok-soft:#dcf4ea; --amber:#855600; --amber-soft:#fdf0d2;
  --p-exec:#0c62fb; --p-tech:#0b7f94; --p-builder:#6a4df4; --p-product:#b8450f; --p-risk:#b3261e; --p-partner:#0f7a55; --p-consultant:#07173d; --p-peer:#a12f79;
  --display:'Lexend Deca','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --qr-bg:#ffffff; --qr-fg:#000000;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#050d24; --surface:#0b1838; --sunk:#101f4a; --ink:#eef3ff; --muted:#9dabd4; --line:#203264;
  --blue:#5b96ff; --on-blue:#041030; --blue-soft:#12296a; --blue-ink:#9fc0ff; --hero:#0c4fd0; --hero-2:#082f86;
  --warn:#ff8a80; --warn-soft:#3d1512; --ok:#5fd6a8; --ok-soft:#0b3326; --amber:#f2c261; --amber-soft:#3a2a06;
  --p-exec:#7fadff; --p-tech:#5fd0e4; --p-builder:#a996ff; --p-product:#ff9d6b; --p-risk:#ff8a80; --p-partner:#5fd6a8; --p-consultant:#c9d6ff; --p-peer:#f08cc8;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#050d24; --surface:#0b1838; --sunk:#101f4a; --ink:#eef3ff; --muted:#9dabd4; --line:#203264;
  --blue:#5b96ff; --on-blue:#041030; --blue-soft:#12296a; --blue-ink:#9fc0ff; --hero:#0c4fd0; --hero-2:#082f86;
  --warn:#ff8a80; --warn-soft:#3d1512; --ok:#5fd6a8; --ok-soft:#0b3326; --amber:#f2c261; --amber-soft:#3a2a06;
  --p-exec:#7fadff; --p-tech:#5fd0e4; --p-builder:#a996ff; --p-product:#ff9d6b; --p-risk:#ff8a80; --p-partner:#5fd6a8; --p-consultant:#c9d6ff; --p-peer:#f08cc8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--blue-ink)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.25rem;flex:1;min-width:0}
.brand h1 small{font-family:var(--body);font-size:.72rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:8px;white-space:nowrap}
.sync{font-size:.72rem;color:var(--muted);white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;flex:none;font-size:1.1rem;line-height:1}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.day{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;white-space:nowrap;font-size:.86rem;display:flex;gap:6px;align-items:baseline}
.day b{font-family:var(--display);font-weight:500}
.day span{color:var(--muted);font-size:.78rem}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] span{color:var(--bg);opacity:.75}

main{padding-block:16px 108px;display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head h2{font-size:1.05rem}
.link-btn{background:none;border:0;padding:4px 0;color:var(--blue-ink);font-weight:600;font-size:.86rem}
.muted{color:var(--muted)}
.small{font-size:.84rem}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(6,1fr);max-width:620px;margin:0 auto}
.tab{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.7rem;font-weight:600;min-width:0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--blue-ink)}
.tab[aria-current="page"] svg{stroke:var(--blue)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.small{padding:6px 12px;font-size:.82rem}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* hero */
.hero{background:linear-gradient(160deg,var(--hero),var(--hero-2));color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{font-size:.78rem;font-weight:600;opacity:.85}
.hero h2{font-size:1.55rem;line-height:1.15;color:#fff}
.hero p{opacity:.92;font-size:.94rem}
.hero .btn{background:#fff;border-color:#fff;color:#07173d}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem}
.facts b{font-family:var(--display);font-weight:500;font-size:1.15rem;margin-right:5px}

.note{border-radius:var(--r);padding:12px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note.info{background:var(--blue-soft)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.amber{background:var(--amber-soft);color:var(--amber)}
.note p{flex:1;min-width:200px}

/* lists */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .title{font-weight:600;overflow-wrap:anywhere}
.item .sub{color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--display);font-size:.82rem;color:var(--surface);background:var(--pc,var(--blue))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:14px;padding:2px 9px;font-size:.76rem;font-weight:600;color:var(--muted);background:var(--surface);max-width:100%;overflow-wrap:anywhere;text-align:left}
.chip.persona{color:var(--pc);border-color:var(--pc)}
.chip.flag{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
.chip.ex{background:var(--amber-soft);color:var(--amber);border-color:transparent}
button.chip{padding:6px 12px;font-size:.84rem}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--display);font-weight:500}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 2px;min-width:0;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span,.legend{font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=search],input[type=url],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:84px}
input[type=file]{width:100%;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.item input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--blue)}
label.item{cursor:pointer}
.by{font-size:.78rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{position:relative;display:inline-flex}
.pick input{position:absolute;opacity:0;inset:0;margin:0}
.pick span{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.84rem;font-weight:600;background:var(--surface);color:var(--muted)}
.pick input:checked+span{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.pick input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}

/* goals */
.goal{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.goal-top .num{white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.done i{background:var(--ok)}

/* agenda */
.tl{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:stretch}
.slot .time{font-size:.8rem;color:var(--muted);padding-top:12px;text-align:right;line-height:1.3}
.slot .card{min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;border-left:4px solid var(--tc,var(--line))}
.slot .card.work{background:var(--sunk);border-style:dashed;border-left-style:solid}
.slot .card.skip{opacity:.55}
.slot .card .title{font-weight:600;overflow-wrap:anywhere}
.slot.free .card{border:1px dashed var(--ok);background:var(--ok-soft);color:var(--ok);font-size:.86rem;border-left-width:1px}

/* web */
.webbox{border:1px solid var(--line);border-radius:22px;background:var(--surface);padding:6px}
.webbox svg{display:block;width:100%;height:auto;max-width:440px;margin:0 auto}
.web-link{stroke:var(--line);stroke-width:1.2}
.web-link.on{stroke:var(--blue);stroke-width:2}
.web-link.mine{stroke:var(--blue);stroke-width:1.6;stroke-dasharray:3 3}
.web-sub rect{fill:var(--sunk);stroke:var(--line)}
.web-sub text{fill:var(--ink);font:600 11.5px var(--body)}
.web-sub.on rect{fill:var(--blue);stroke:var(--blue)}
.web-sub.on text{fill:var(--on-blue)}
.web-p circle{fill:var(--pc);stroke:var(--surface);stroke-width:2}
.web-p text{fill:var(--surface);font:500 10px var(--display)}
.web-p.dim{opacity:.25}
.web-p.target circle{stroke:var(--pc);fill:var(--surface);stroke-dasharray:3 2}
.web-p.target text{fill:var(--pc)}
.web-me circle{fill:var(--ink)}
.web-me text{fill:var(--bg);font:500 10px var(--display)}
.web-sub,.web-p{cursor:pointer}
.group{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:8px}

/* pitch */
.timer{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px;border-radius:26px;background:var(--surface);border:1px solid var(--line)}
.dial{position:relative;width:min(100%,280px);aspect-ratio:1;max-width:100%}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{fill:none;stroke:var(--sunk);stroke-width:10}
.dial .prog{fill:none;stroke:var(--blue);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.dial .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dial .t{font-family:var(--display);font-weight:500;font-size:clamp(3.2rem,20vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.timer.late .prog{stroke:var(--amber)} .timer.late .t{color:var(--amber)}
.timer.over .prog{stroke:var(--warn)} .timer.over .t{color:var(--warn)}
.pitch-card{background:var(--blue-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.pitch-card h3{font-size:1.2rem}

/* report */
.report{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.report h3{font-size:1.2rem}
.report h4{font-family:var(--display);font-weight:500;font-size:1rem;margin:12px 0 0}
.report h5{font-size:.82rem;font-weight:700;color:var(--muted);margin:6px 0 0;letter-spacing:.02em}
.report ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.kit{display:flex;flex-direction:column;gap:8px;padding:14px;border-top:1px solid var(--line)}
.kit:first-child{border-top:0}
.kit h3{font-size:1rem;color:var(--pc)}
.kit ul{margin:0;padding-left:18px;font-size:.9rem}
.quote{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.9rem;white-space:pre-wrap}

/* agents */
.agent-card{background:var(--blue-soft);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.agent-card h3{font-size:1.5rem}
.agent-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.9rem}
.agent-card dt{color:var(--muted);font-weight:600;font-size:.8rem;padding-top:2px}
.agent-card dd{margin:0;min-width:0;overflow-wrap:anywhere}
.qr{background:var(--qr-bg);border-radius:16px;padding:14px;align-self:center;width:min(100%,300px)}
.qr svg{display:block;width:100%;height:auto}
.qr path{fill:var(--qr-fg)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(3,9,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--bg);width:100%;max-width:620px;max-height:92%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;margin:0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px}
.sheet-head h2{font-size:1.2rem}
.sheet-body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet-foot .spacer{flex:1}
@media (min-width:700px){.sheet{align-items:center}.sheet-card{border-radius:22px}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
.foot{font-size:.76rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap top-in">
  <div class="brand">
    <h1 id="brand">r4 companion</h1>
    <span class="sync" id="sync"></span>
    <button class="icon-btn" type="button" data-act="settings" aria-label="Event settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </div>

</div></header>

<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>

</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------- reference content ---------- */
const PERSONAS = [
  {id:'exec', name:'executive sponsor',

    offer:['a repo or working example','a how-to write-up','an invite to a practitioner group'],

    follow:'Hi {first}, thanks for the conversation at {event}. Your point about {topic} stayed with me. I have a short case study that fits, and I can introduce you to a product lead who went through it. Interested?'},
  {id:'risk', name:'governance and risk lead',

  {id:'partner', name:'partner or vendor',

    follow:'Hi {first}, glad we connected at {event}. I see a fit around {topic}. Can we compare notes on two or three accounts where working together makes sense?'},
  {id:'consultant', name:'slalom team member',

    ask:['What are your clients asking about most this quarter?','What asset do you wish you had?'],

function mdToHtml(md){
  let html = '', inList = false; const close = () => { if (inList) { html += '</ul>'; inList = false; } };
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  for (const line of md.split('\n')){
    if (line.startsWith('- ')) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(line.slice(2)) + '</li>'; continue; }
    close();
    if (line.startsWith('### ')) html += '<h5>' + inline(line.slice(4)) + '</h5>';
    else if (line.startsWith('## ')) html += '<h4>' + inline(line.slice(3)) + '</h4>';
    else if (line.startsWith('# ')) html += '<h3>' + inline(line.slice(2)) + '</h3>';
    else if (line.trim()) html += '<p class="muted small">' + inline(line) + '</p>';
  }
  close(); return html;
}

function webSvg(top, sel){
  const W = 400, cx = 200, cy = 200, mineSet = new Set(cfg().topics), pos = {};
  top.forEach((s, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / top.length, r = top.length >= 6 ? 96 : 84; pos[s.t] = {a, x:cx + r * Math.cos(a), y:cy + r * Math.sin(a)}; });
  let arr = S.people.filter(p => (p.topics || []).some(t => pos[t])).slice(0, 28).map((p, i) => { let x = 0, y = 0;
    for (const t of p.topics) if (pos[t]) { x += Math.cos(pos[t].a); y += Math.sin(pos[t].a); }
    return {p, a:Math.abs(x) + Math.abs(y) > .01 ? Math.atan2(y, x) : i * 2.4}; }).sort((a, b) => a.a - b.a);
  const n = arr.length, gap = Math.min(2 * Math.PI / Math.max(n, 1), .36) * .97;
  for (let pass = 0; pass < 60 && n > 1; pass++) for (let i = 0; i < n; i++){ const j = (i + 1) % n; const d = arr[j].a - arr[i].a + (j === 0 ? 2 * Math.PI : 0);
    if (d < gap) { const push = (gap - d) / 2; arr[i].a -= push; arr[j].a += push; } }
  let links = '', nodes = '';
  for (const s of top) if (mineSet.has(s.t)) links += '<line class="web-link mine" x1="' + cx + '" y1="' + cy + '" x2="' + pos[s.t].x.toFixed(1) + '" y2="' + pos[s.t].y.toFixed(1) + '"/>';
  for (const o of arr){ o.x = cx + 176 * Math.cos(o.a); o.y = cy + 176 * Math.sin(o.a);
    for (const t of o.p.topics) if (pos[t]) links += '<line class="web-link' + (sel === t ? ' on' : '') + '" x1="' + pos[t].x.toFixed(1) + '" y1="' + pos[t].y.toFixed(1) + '" x2="' + o.x.toFixed(1) + '" y2="' + o.y.toFixed(1) + '"/>'; }
  for (const o of arr){ const dim = sel && !o.p.topics.includes(sel);
    nodes += '<g class="web-p' + (dim ? ' dim' : '') + (o.p.status === 'target' ? ' target' : '') + '" ' + pc(o.p.persona) + ' data-act="viewPerson" data-id="' + o.p.id + '" role="button" tabindex="0" aria-label="' + esc(o.p.name) + '">' +
      '<circle cx="' + o.x.toFixed(1) + '" cy="' + o.y.toFixed(1) + '" r="14"/><text x="' + o.x.toFixed(1) + '" y="' + (o.y + 3.5).toFixed(1) + '" text-anchor="middle">' + esc(initials(o.p.name)) + '</text></g>'; }
  for (const s of top){ const label = s.t.length > 14 ? s.t.slice(0, 13) + '…' : s.t, w = label.length * 6.4 + 16, q = pos[s.t];
    nodes += '<g class="web-sub' + (sel === s.t ? ' on' : '') + '" data-act="subject" data-t="' + esc(s.t) + '" role="button" tabindex="0" aria-label="' + esc(s.t) + ', ' + s.people.length + ' people">' +
      '<rect x="' + (q.x - w / 2).toFixed(1) + '" y="' + (q.y - 11).toFixed(1) + '" width="' + w.toFixed(1) + '" height="22" rx="11"/><text x="' + q.x.toFixed(1) + '" y="' + (q.y + 3.8).toFixed(1) + '" text-anchor="middle">' + esc(label) + '</text></g>'; }
  nodes += '<g class="web-me"><circle cx="' + cx + '" cy="' + cy + '" r="17"/><text x="' + cx + '" y="' + (cy + 3.5) + '" text-anchor="middle">you</text></g>';
  return '<svg viewBox="0 0 ' + W + ' ' + W + '" role="img" aria-label="Web of subjects and the people connected to each">' + links + nodes + '</svg>';
}

      p.ai = {summary:sum, note:String((r && r.note) || '').trim().slice(0, 1400), at:todayISO()}; save('people'); toast('Written');
      if (sheet === mine) acts.viewPerson({id:p.id});
    } catch (e) { if (sheet !== mine) return; const msg = askFail(e); p = person(d.id);
      if (!ask && p) { toast(msg); acts.viewPerson({id:p.id}); return; }
      if (out) out.textContent = p ? summary(p) : ''; if (btn) btn.disabled = false; toast(msg); }
  },
  clearSummary(d){ const p = person(d.id); if (!p) return; delete p.ai; save('people'); acts.viewPerson({id:p.id}); },
  async writeAll(){ const list = unwritten().slice(0, BATCH), sent = new Set(list.map(p => p.id)); if (!ask || !list.length || ui.writing) return;
    ui.writing = true; render();
    try { const raw = await ask.json(batchPrompt(list), {modelTier:'quick', cache:false}); let n = 0;
      for (const r of Array.isArray(raw) ? raw : []){ const id = r && String(r.id); if (!sent.has(id)) continue; sent.delete(id);
        const p = person(id), sum = clean(r.summary, 700), msg = String(r.note || '').trim().slice(0, 1400);
        if (p && sum) { p.ai = {...(p.ai || {}), summary:sum, ...(msg ? {note:msg} : {}), at:todayISO()}; n++; } }
      if (n) save('people'); toast(n ? 'Wrote ' + n + (n === 1 ? ' summary' : ' summaries') : 'Claude’s reply could not be read. Try again.');
    } catch (e) { toast(askFail(e)); }
    ui.writing = false; softRender();
  },
  addGoal(){ acts.editGoal({}); },
  editGoal(d){ const g = S.goals.find(x => x.id === d.id) || {};
    openSheet({title:g.id ? 'edit goal' : 'new goal', body:field('Goal', 'f-text', input('f-text', 'text', g.text, 'placeholder="meet five executive sponsors"')) +
      '<div class="grid2">' + field('Counts', 'f-kind', '<select id="f-kind" name="kind">' + [['meet','everyone I meet'],['persona','people of one persona'],['followups','follow-ups I finish'],['custom','I will count it myself']].map(([v, l]) => '<option value="' + v + '"' + (v === (g.kind || 'meet') ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>') +
      field('Target', 'f-target', '<input type="number" id="f-target" name="target" min="1" max="200" value="' + (g.target || 5) + '">') + '</div>' +
      field('Persona, if the goal is about one', 'f-gp', '<select id="f-gp" name="persona">' + PERSONAS.map(k => '<option value="' + k.id + '"' + (k.id === g.persona ? ' selected' : '') + '>' + k.name + '</option>').join('') + '</select>'),
      onSave(fd){ const text = String(fd.get('text') || '').trim(); if (!text) { toast('Write the goal first.'); return false; }
        const n = {id:g.id || uid(), text, kind:fd.get('kind'), persona:fd.get('persona'), target:Math.max(1, +fd.get('target') || 1), count:g.count || 0};
        if (g.id) S.goals[S.goals.indexOf(g)] = n; else S.goals.push(n); save('goals'); },
      onDelete:g.id ? () => { S.goals = S.goals.filter(x => x !== g); save('goals'); } : null}); },
  bumpGoal(d){ const g = S.goals.find(x => x.id === d.id); if (!g) return; g.count = (+g.count || 0) + 1; save('goals'); render(); },
  addSession(){ acts.editSession({}); },
  editSession(d){ const s = S.sessions.find(x => x.id === d.id) || {};
    openSheet({title:s.id ? s.title : 'new session', body:sessionForm(s),
      onSave(fd){ const title = String(fd.get('title') || '').trim(); if (!title) { toast('Give the session a title.'); return false; } if (!timeOk(fd)) return false;
        const n = {id:s.id || uid(), title, type:fd.get('type'), day:+fd.get('day') || 0, start:fd.get('start'), end:fd.get('end'), room:String(fd.get('room') || '').trim(), going:!!fd.get('going'),
          attendees:fd.getAll('attendees'), notes:String(fd.get('notes') || '').trim(), takeaways:lines(fd.get('takeaways')), proposals:lines(fd.get('proposals'))};
        if (s.id) S.sessions[S.sessions.indexOf(s)] = n; else S.sessions.push(n); save('sessions'); toast('Saved'); },
      onDelete:s.id ? () => { S.sessions = S.sessions.filter(x => x !== s); save('sessions'); } : null}); },
  addBlock(){ acts.editBlock({}); },
  editBlock(d){ const b = S.blocks.find(x => x.id === d.id) || {};
    openSheet({title:b.id ? 'edit work block' : 'new work block', body:'<p class="small muted">Work you cannot move: client calls, approvals, a deadline. The agenda flags anything it clashes with.</p>' +
      field('What it is', 'f-title', input('f-title', 'title', b.title, 'placeholder="client status call"')) + field('Day', 'f-day', daySelect(b.day ?? ui.day)) +
      '<div class="grid2">' + field('Starts', 'f-start', '<input type="time" id="f-start" name="start" value="' + esc(b.start || '14:00') + '">') + field('Ends', 'f-end', '<input type="time" id="f-end" name="end" value="' + esc(b.end || '14:30') + '">') + '</div>',
      onSave(fd){ const title = String(fd.get('title') || '').trim(); if (!title) { toast('Name the work block.'); return false; } if (!timeOk(fd)) return false;
        const n = {id:b.id || uid(), title, day:+fd.get('day') || 0, start:fd.get('start'), end:fd.get('end')};
        if (b.id) S.blocks[S.blocks.indexOf(b)] = n; else S.blocks.push(n); save('blocks'); toast('Saved'); },
      onDelete:b.id ? () => { S.blocks = S.blocks.filter(x => x !== b); save('blocks'); } : null}); },
  subject(d){ ui.subject = ui.subject === d.t ? null : d.t; render(); },
  groupSize(d){ ui.groupSize = +d.n; render(); },
  copyGroup(d){ const g = buildGroups(ui.subject, ui.groupSize)[+d.i]; if (!g) return;
    copyText('Small group on ' + ui.subject + ' at ' + cfg().event + '\n' + g.map(p => '- ' + p.name + ([p.role, p.company].filter(Boolean).length ? ', ' + [p.role, p.company].filter(Boolean).join(', ') : '')).join('\n') +
      '\n\nYou have all been working on ' + ui.subject + ' from different seats. Fifteen minutes together would be worth it. Opener: what is one thing you tried that surprised you?', 'Invite copied'); },
  copyIntro(d){ const a = person(d.a), b = person(d.b); if (!a || !b) return; const shared = (a.topics || []).filter(t => (b.topics || []).includes(t));
    copyText(a.name.split(' ')[0] + ', meet ' + b.name.split(' ')[0] + '. ' + b.name.split(' ')[0] + ', meet ' + a.name.split(' ')[0] + '.\n\nI met you both at ' + cfg().event + ' and you each brought up ' + shared.join(' and ') + '. ' +
      a.name + ' is ' + [a.role, a.company].filter(Boolean).join(' at ') + '. ' + b.name + ' is ' + [b.role, b.company].filter(Boolean).join(' at ') + '. I think you would get a lot from comparing notes, so I will leave it with you.', 'Intro copied'); },
  addPitch(){ acts.editPitch({}); },
  editPitch(d){ const x = S.pitches.find(p => p.id === d.id) || {};
    openSheet({title:x.id ? 'edit pitcher' : 'add pitcher', body:field('Name', 'f-name', input('f-name', 'name', x.name, 'autocomplete="off"')) + field('Their pitch in one line', 'f-topic', input('f-topic', 'topic', x.topic, 'autocomplete="off"')), saveLabel:x.id ? 'save' : 'add',
      onSave(fd){ const name = String(fd.get('name') || '').trim(); if (!name) { toast('Add a name.'); return false; }
        const n = {id:x.id || uid(), name, topic:String(fd.get('topic') || '').trim(), status:x.status || 'queued', sparked:!!x.sparked};
        if (x.id) S.pitches[S.pitches.indexOf(x)] = n; else S.pitches.push(n); save('pitches'); },
      onDelete:x.id ? () => { S.pitches = S.pitches.filter(p => p !== x); save('pitches'); } : null}); },
  spark(d){ const x = S.pitches.find(p => p.id === d.id); if (!x || x.sparked) return;
    let p = S.people.find(q => q.name.toLowerCase() === x.name.toLowerCase()); const fu = {text:'follow up on their pitch: ' + (x.topic || 'pitch fest'), due:'week', done:false};
    if (!p) { p = {id:uid(), name:x.name, company:'', role:'', status:'met', persona:'peer', topics:[], note:'Pitched at pitch fest: ' + x.topic, fu, day:ui.day, star:false}; S.people.push(p); }
    else { p.status = 'met'; if (!p.fu || !p.fu.text || p.fu.done) p.fu = fu; }
    x.sparked = true; save('people', 'pitches'); render(); toast(x.name.split(' ')[0] + ' is in your follow-ups'); },
  tSet(d){ T.total = +d.s; T.left = T.total; T.running = false; render(); },
  tToggle(){ if (T.running) { T.left = Math.max(0, (T.end - Date.now()) / 1000); T.running = false; }
    else { if (T.left <= 0) T.left = T.total; T.end = Date.now() + T.left * 1000; T.running = true;
      try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
      try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
      if (!S.pitches.some(x => x.status === 'live')) { const q = S.pitches.find(x => x.status === 'queued'); if (q) { q.status = 'live'; save('pitches'); } } }
    render(); },
  tReset(){ T.running = false; T.left = T.total; render(); },
  tNext(){ const cur = S.pitches.find(x => x.status === 'live'); if (cur) cur.status = 'done'; const q = S.pitches.find(x => x.status === 'queued'); if (q) q.status = 'live';
    T.left = T.total; T.running = !!q; T.end = Date.now() + T.total * 1000; save('pitches'); render(); },
  recap(){ const md = buildRecap(ui.day); openSheet({title:(days()[ui.day] || days()[0]).label + ' recap', body:'<div class="report">' + mdToHtml(md) + '</div><div class="row"><button type="button" class="btn primary" data-act="copyRecap">copy recap</button></div>'}); },
  copyRecap(){ copyText(buildRecap(ui.day), 'Recap copied'); },
  copyReport(){ copyText(buildReport(), 'Report copied'); },
  saveReport(){ if (!dl) return; dl.save({filename:cfg().event.replace(/[^\w-]+/g, '-') + '-team-report.md', data:buildReport()}).then(() => toast('Report saved'), e => { if (!e || e.code !== 'declined') toast('Could not save the file here. Copy the report instead.'); }); }
};

document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = acts[el.dataset.act]; if (fn) fn(el.dataset, el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheet) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-act]')) { e.preventDefault(); const fn = acts[e.target.dataset.act]; if (fn) fn(e.target.dataset, e.target); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { ui.q = e.target.value; const l = $('#plist'); if (l) l.innerHTML = peopleList(); } });
$('#sheet-form').addEventListener('submit', e => { e.preventDefault(); if (!sheet || !sheet.onSave) return; if (sheet.onSave(new FormData(e.target)) !== false) closeSheet(); });
setInterval(() => {
  if (!T.running) return;
  T.left = (T.end - Date.now()) / 1000;
  if (T.left <= 0) { T.left = 0; T.running = false; beep(); if (ui.tab === 'pitch') softRender(); }
  paintTimer();
}, 200);
setInterval(() => { if (ui.tab === 'today') softRender(); }, 60000);

async function boot(){
  ui.loaded = cacheRead(); pickDay(); render();
  const c = window.claude;
  const local = () => { ui.store = 'local'; ui.loaded = true; softRender(); };
  if (!c || typeof c.use !== 'function') return local();
  c.use('downloads').then(n => { dl = n; if (ui.tab === 'report') softRender(); }, () => {});
  c.use('sample').then(async fn => { if (!fn) return; ask = fn;
    try { const caps = await fn.limits(); askImages = (caps && caps.images) || null; } catch (e) { askImages = null; }
    softRender(); }, () => {});
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) return local();
    col = db.collection('data/users/' + id); ui.store = 'sync'; paintSync();
    col.onSnapshot(onSnap, () => { col = null; local(); });
  } catch (e) { local(); }
}
boot();
})();
</script>
</body></html>
